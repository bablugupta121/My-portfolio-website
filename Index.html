<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Bablu Kumar - BTech CSE Portfolio">
<title>Bablu Kumar | Portfolio</title>

<!-- Optional Supabase CDN. The site still works locally if Supabase is unavailable. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#08111f;
  --bg2:#0d1728;
  --card:#101d31;
  --card2:#14243b;
  --text:#f5f8ff;
  --muted:#aebbd0;
  --border:rgba(255,255,255,.10);
  --accent:#3b82f6;
  --accent-rgb:59,130,246;
  --success:#2ed573;
  --danger:#ff4757;
  --shadow:0 18px 50px rgba(0,0,0,.25);
  --radius:20px;
  --font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:var(--font-size);
  background:
    radial-gradient(circle at 20% 10%,rgba(var(--accent-rgb),.13),transparent 28%),
    radial-gradient(circle at 90% 80%,rgba(var(--accent-rgb),.09),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .35s,color .35s;
}
body.light{
  --bg:#f3f7fc;
  --bg2:#ffffff;
  --card:#ffffff;
  --card2:#eef4fb;
  --text:#142033;
  --muted:#5d6a7d;
  --border:rgba(20,32,51,.12);
  --shadow:0 15px 40px rgba(35,58,90,.12);
}
body.modal-open{overflow:hidden}
button,input,textarea,select{font:inherit}
button{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* Loader */
#loader{
  position:fixed;inset:0;z-index:99999;display:grid;place-items:center;
  background:var(--bg);transition:.35s
}
.loader-box{text-align:center}
.loader-ring{
  width:62px;height:62px;border:4px solid rgba(var(--accent-rgb),.2);
  border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:auto auto 14px
}
.loader-box b{font-size:18px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Header */
.header{
  position:fixed;top:0;left:0;right:0;height:68px;z-index:900;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px;background:rgba(8,17,31,.80);
  backdrop-filter:blur(18px);border-bottom:1px solid var(--border)
}
body.light .header{background:rgba(255,255,255,.84)}
.header-left,.header-right{display:flex;align-items:center;gap:8px}
.brand{
  position:absolute;left:calc(50% - 22px);transform:translateX(-50%);
  font-weight:800;letter-spacing:.2px;white-space:nowrap
}
.icon-btn{
  width:42px;height:42px;border:1px solid var(--border);background:var(--card);
  border-radius:12px;display:inline-grid;place-items:center;cursor:pointer;
  transition:.2s;font-size:20px
}
.icon-btn:hover{transform:translateY(-1px);border-color:rgba(var(--accent-rgb),.55);box-shadow:0 8px 25px rgba(var(--accent-rgb),.14)}
.mode-badge{
  display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;
  background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.28);
  color:var(--text);font-size:12px;font-weight:700
}
.admin-badge{display:none}
body.admin .admin-badge{display:inline-flex}

/* Sidebar */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:285px;z-index:1000;
  background:var(--bg2);border-right:1px solid var(--border);
  padding:24px 16px;overflow-y:auto;transform:translateX(-102%);
  transition:transform .3s ease;box-shadow:var(--shadow)
}
.sidebar.open{transform:translateX(0)}
.sidebar-top{display:flex;justify-content:flex-end;margin-bottom:4px}
.sidebar-close{font-size:22px}
.sidebar-profile{text-align:center;margin:8px 0 22px}
.sidebar-photo-wrap{
  position:relative;width:112px;height:112px;margin:0 auto 10px
}
.sidebar-photo{
  width:96px;height:96px;position:absolute;left:8px;top:8px;
  border-radius:50%;object-fit:cover;border:3px solid var(--accent);
  box-shadow:0 0 25px rgba(var(--accent-rgb),.30);cursor:pointer
}
.sidebar-photo-wrap::before,.sidebar-photo-wrap::after{
  content:"";position:absolute;inset:1px;border:1px solid rgba(var(--accent-rgb),.7);
  border-radius:50%;animation:ringPulse 2.5s ease-in-out infinite
}
.sidebar-photo-wrap::after{inset:-5px;opacity:.45;animation-delay:.7s}
.sidebar-active-dot{
  position:absolute;right:2px;bottom:10px;width:16px;height:16px;background:#2ed573;
  border:3px solid var(--bg2);border-radius:50%;box-shadow:0 0 15px #2ed573;
  animation:activePulse 1.3s infinite!important
}
@keyframes activePulse{0%,100%{transform:scale(.85);box-shadow:0 0 6px #2ed573}50%{transform:scale(1.12);box-shadow:0 0 18px #2ed573}}
@keyframes ringPulse{0%,100%{transform:scale(.95);opacity:.45}50%{transform:scale(1.05);opacity:1}}
.sidebar-name{font-size:20px;font-weight:800}
.sidebar-name span{color:var(--accent)}
.sidebar-profile small{color:var(--muted)}
.nav-list{display:grid;gap:6px}
.nav-btn{
  width:100%;border:1px solid transparent;background:transparent;color:var(--muted);
  padding:11px 12px;border-radius:12px;text-align:left;display:flex;align-items:center;gap:11px;
  cursor:pointer;transition:.2s
}
.nav-btn:hover,.nav-btn.active{background:rgba(var(--accent-rgb),.12);color:var(--text);border-color:rgba(var(--accent-rgb),.20)}
.nav-icon{width:24px;text-align:center}
.sidebar-note{
  margin-top:20px;padding:12px;border:1px solid var(--border);border-radius:14px;
  color:var(--muted);font-size:12px;line-height:1.55
}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:950;
  opacity:0;pointer-events:none;transition:.25s
}
.overlay.show{opacity:1;pointer-events:auto}

/* Main / pages */
main{padding-top:68px;min-height:100vh}
.page-section{
  display:none;max-width:1180px;margin:0 auto;padding:40px 22px 70px;
  min-height:calc(100vh - 68px)
}
.page-section.active{display:block;animation:pageIn .35s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:24px}
.eyebrow{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:8px}
.page-head h1{font-size:clamp(28px,4vw,42px);line-height:1.12;margin-bottom:8px}
.page-head p{color:var(--muted);max-width:760px;line-height:1.7}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--card);
  border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow)
}
.card h2,.card h3{margin-bottom:9px}
.education-click-card{cursor:pointer;transition:.2s}.education-click-card:hover{transform:translateY(-2px);border-color:rgba(var(--accent-rgb),.45)}
.edu-doc-list{display:grid;gap:12px;margin-top:14px}.edu-doc{border:1px solid var(--border);background:var(--card2);border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.skill-card{cursor:pointer}
.skill-card:hover{transform:translateY(-2px);border-color:rgba(var(--accent-rgb),.45)}
.skill-detail-file{border:1px solid var(--border);background:var(--card2);border-radius:14px;padding:12px;margin-top:10px}
.zoom-photo{transition:transform .25s ease;cursor:zoom-in}
.zoom-photo.zoomed{transform:scale(1.65);cursor:zoom-out;max-width:92vw;max-height:86vh}.edu-doc small{color:var(--muted)}
.card p{color:var(--muted);line-height:1.7}
.tag{
  display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(var(--accent-rgb),.12);
  border:1px solid rgba(var(--accent-rgb),.22);font-size:12px;font-weight:700;margin:3px
}
.btn{
  border:1px solid rgba(var(--accent-rgb),.35);background:var(--accent);color:#fff;
  padding:10px 15px;border-radius:12px;cursor:pointer;font-weight:750;transition:.2s
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.secondary{background:transparent;color:var(--text);border-color:var(--border)}
.btn.danger{background:var(--danger);border-color:transparent}
.btn.success{background:var(--success);border-color:transparent;color:#07150d}
.btn.small{padding:7px 10px;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* Home */
.hero{
  min-height:calc(100vh - 68px);display:grid;place-items:center;text-align:center
}
.hero-inner{width:min(850px,100%);margin:auto;transform:translateY(-42px)}
@media(max-width:600px){.hero-inner{transform:translateY(-32px)}}
.hero-photo-wrap{
  position:relative;width:204px;height:204px;margin:0 auto 20px
}
.hero-photo{
  position:absolute;left:17px;top:17px;width:170px;height:170px;border-radius:50%;
  object-fit:cover;border:4px solid var(--accent);cursor:pointer;
  box-shadow:0 0 34px rgba(var(--accent-rgb),.30)
}
.hero-photo-wrap::before,.hero-photo-wrap::after{
  content:"";position:absolute;inset:3px;border:2px solid rgba(var(--accent-rgb),.75);
  border-radius:50%;animation:ringPulse 2.6s infinite
}
.hero-photo-wrap::after{inset:-7px;opacity:.38;animation-delay:.7s}
.hero-active-dot{
  position:absolute;right:8px;bottom:20px;width:20px;height:20px;background:#2ed573;
  border:4px solid var(--bg);border-radius:50%;box-shadow:0 0 20px #2ed573;
  animation:activePulse 1.3s infinite!important
}
.photo-more{
  position:absolute;right:15px;bottom:56px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:rgba(0,0,0,.62);backdrop-filter:blur(8px);
  color:#fff;cursor:pointer;font-size:20px;line-height:1
}
.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.1;margin-bottom:9px}
.hero h1 span{color:var(--accent)}
.hero-role{font-size:clamp(17px,2.4vw,23px);min-height:34px;font-weight:700;margin-bottom:9px}
.cursor{color:var(--accent);animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
.hero-sub{color:var(--muted);max-width:690px;margin:auto;line-height:1.7;font-size:15px}
.hero-buttons{justify-content:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}
.stat{padding:15px;border:1px solid var(--border);background:rgba(var(--accent-rgb),.06);border-radius:15px}
.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--border);background:var(--bg2);color:var(--text);
  border-radius:12px;padding:11px 12px;outline:none
}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.10)}

/* Password */
.password-box{position:relative}
.password-box input{padding-right:48px}
.show-password-btn{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;width:40px;height:40px;cursor:pointer;border-radius:10px
}
.show-password-btn:hover{background:rgba(var(--accent-rgb),.12)}

/* Skills */
.skills-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.skill-card{position:relative}
.skill-icon{
  width:44px;height:44px;display:grid;place-items:center;border-radius:13px;
  background:rgba(var(--accent-rgb),.13);font-size:22px;margin-bottom:12px
}
.skill-meta{display:flex;justify-content:space-between;gap:10px;align-items:center}
.skill-code{
  margin-top:12px;padding:12px;border-radius:12px;background:#050b14;color:#dbe7ff;
  overflow:auto;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:220px
}
body.light .skill-code{background:#eef3f9;color:#172236}
.admin-controls{display:none;flex-wrap:wrap;gap:7px;margin-top:12px}
body.admin .admin-controls{display:flex}
.admin-only{display:none!important}
body.admin .admin-only{display:inline-flex!important}
.file-list{display:grid;gap:9px;margin-top:12px}
.file-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:rgba(var(--accent-rgb),.04)
}
.file-item small{color:var(--muted)}

/* Skill detail */
.skill-view-btn{margin-top:12px;width:100%}
.skill-detail-list{display:grid;gap:10px;margin-top:14px}
.skill-detail-file{padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(var(--accent-rgb),.05)}
.skill-detail-code{margin-top:8px;max-height:360px;overflow:auto;white-space:pre-wrap;word-break:break-word}
/* Timeline */
.timeline{position:relative;margin-top:8px}
.timeline::before{
  content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:rgba(var(--accent-rgb),.35)
}
.timeline-item{position:relative;padding-left:38px;margin-bottom:20px}
.timeline-dot{
  position:absolute;left:3px;top:5px;width:16px;height:16px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 14px rgba(var(--accent-rgb),.55)
}
.timeline-item h3{margin-bottom:4px}.timeline-item small{color:var(--accent)}

/* Search */
.search-box{
  position:fixed;top:75px;right:18px;width:min(410px,calc(100vw - 36px));z-index:1200;
  background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;
  box-shadow:var(--shadow);display:none
}
.search-box.show{display:block;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(-4px)}to{opacity:1;transform:none}}
.search-input{width:100%;padding:11px;border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:11px}
.search-results{display:grid;gap:6px;margin-top:8px;max-height:320px;overflow:auto}
.search-result{padding:9px;border-radius:10px;cursor:pointer;color:var(--muted)}
.search-result:hover{background:rgba(var(--accent-rgb),.11);color:var(--text)}

/* Settings */
.modal{
  position:fixed;inset:0;z-index:3000;display:none;place-items:center;padding:18px;
  background:rgba(0,0,0,.62);backdrop-filter:blur(8px)
}
.modal.show{display:grid}
.modal-panel{
  width:min(650px,100%);max-height:min(90vh,760px);overflow:auto;
  background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:20px
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.modal-head h2{font-size:22px}
.close-btn{width:40px;height:40px;border:1px solid var(--border);background:transparent;border-radius:11px;cursor:pointer;font-size:24px}
.setting-group{padding:14px 0;border-bottom:1px solid var(--border)}
.setting-group:last-child{border-bottom:0}
.setting-title{font-weight:800;margin-bottom:9px}
.option-row{display:flex;flex-wrap:wrap;gap:8px}
.option{
  border:1px solid var(--border);background:var(--bg2);padding:9px 12px;border-radius:11px;
  cursor:pointer;color:var(--muted)
}
.option.selected{border-color:var(--accent);background:rgba(var(--accent-rgb),.14);color:var(--text)}
.color-wrap{display:flex;align-items:center;gap:10px}
.color-wrap input{width:54px;height:40px;padding:2px;border:1px solid var(--border);background:transparent;border-radius:10px}

/* Photo modal */
.photo-modal{position:fixed;inset:0;z-index:4000;display:none;place-items:center;overflow:auto;padding:20px;background:rgba(0,0,0,.90);touch-action:pan-x pan-y;-webkit-tap-highlight-color:transparent}
.photo-modal.show{display:grid}
.zoom-photo{
  display:block;width:auto;height:auto;max-width:92vw;max-height:86vh;object-fit:contain;
  border-radius:18px;box-shadow:0 0 50px rgba(var(--accent-rgb),.25);
  transition:transform .22s ease;cursor:zoom-in;touch-action:manipulation;user-select:none;-webkit-user-drag:none
}
.zoom-photo.zoomed{transform:scale(1.7);transform-origin:center center;cursor:zoom-out;max-width:none;max-height:none}
.photo-modal .modal-close{position:absolute;right:20px;top:20px;z-index:2}

/* Login */
.login-wrap{max-width:470px;margin:40px auto}
.login-info{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  z-index:5000;padding:11px 15px;border-radius:12px;background:#111b2d;color:#fff;
  border:1px solid var(--border);box-shadow:var(--shadow);transition:.25s;max-width:calc(100vw - 30px);text-align:center
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Footer */
#siteFooter{padding:0 22px 26px}
.footer{
  max-width:1180px;margin:auto;padding:20px;border-top:1px solid var(--border);
  display:flex;justify-content:center;align-items:center;text-align:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px
}
.footer a{color:var(--accent)}

/* Screenshot/print deterrents */
@media print{body>*{display:none!important}}
::selection{background:rgba(var(--accent-rgb),.30)}

/* Responsive: everything adapts */
@media (max-width:1000px){
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:700px){
  :root{--font-size:14px}
  .header{height:60px;padding:8px 10px}
  main{padding-top:60px}
  .brand{font-size:14px}
  .header-right .icon-btn{width:38px;height:38px;font-size:17px}
  .header-right{gap:4px}
  .mode-badge{display:none}
  .page-section{padding:27px 14px 50px;min-height:calc(100vh - 60px)}
  .page-head h1{font-size:30px}
  .hero{min-height:calc(100vh - 60px)}
  .hero-photo-wrap{width:170px;height:170px;margin-bottom:16px}
  .hero-photo{width:142px;height:142px;left:14px;top:14px}
  .hero-active-dot{right:4px;bottom:15px;width:18px;height:18px}
  .photo-more{display:none;right:7px;bottom:43px}
  .hero h1{font-size:35px}
  .hero-role{font-size:18px}
  .hero-sub{font-size:14px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .card{padding:16px;border-radius:17px}
  .sidebar{width:min(300px,88vw)}
}
@media (max-width:430px){
  .hero h1{font-size:30px}
  .hero-photo-wrap{width:150px;height:150px}
  .hero-photo{width:126px;height:126px;left:12px;top:12px}
  .stats{gap:8px}.stat{padding:11px}.stat b{font-size:19px}
  .actions .btn{flex:1 1 auto}
  .footer{padding:16px 0}
}

/* If animations are switched off, the online dot keeps blinking intentionally. */
body.no-animations *{animation:none!important;transition:none!important}
body.no-animations .hero-active-dot,
body.no-animations .sidebar-active-dot{animation:activePulse 1.3s infinite!important}


/* =========================
   RESUME + DP UPLOAD MANAGER
   ========================= */
.resume-manager-card,.resume-upload-box,.dp-upload-box{position:relative}
.upload-label{display:block;font-weight:800;margin-bottom:8px}
.resume-upload-box input[type=file],.dp-upload-box input[type=file]{display:block;width:100%;padding:10px;border:1px dashed var(--border);border-radius:12px;background:var(--panel-2);color:var(--text);margin:8px 0}
.resume-upload-box small,.dp-upload-box small{display:block;color:var(--muted);line-height:1.5}
.dp-upload-box{max-width:430px;margin:18px auto 0;padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--panel);text-align:left}
.resume-upload-box{padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--panel-2)}
@media(max-width:700px){.dp-upload-box{max-width:100%}}


/* Home profile photo position */
 .hero-photo-wrap {
  transform: translateY(-72px);
}
@media (max-width: 700px) {
  .hero-photo-wrap { transform: translateY(-48px); }
}

.cms-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.cms-card{position:relative}
.cms-empty{padding:24px;text-align:center;color:var(--muted)}
.cms-meta{color:var(--muted);font-size:13px;margin:5px 0 10px}
.cms-links{display:flex;flex-wrap:wrap;gap:
